outreach:
  candidate_name: "[Your Name]"
  candidate_core_tech: ["python", "langchain", "rag", "llm apps"]
  candidate_extra_tech: ["fastapi", "react", "typescript", "docker"]
  linkedin_search_titles:
    - { title: "Engineering Manager", label: "Eng Manager", category: "engineering" }
    - { title: "Head of AI", label: "Head of AI", category: "engineering" }
    - { title: "CTO", label: "CTO", category: "executive" }
    - { title: "CEO Founder", label: "CEO / Founder", category: "executive" }
    - { title: "Technical Recruiter", label: "Tech Recruiter", category: "hr" }
  bio_short: "an engineer building {stack} AI products"
  achievements:
    - "[Achievement 1 — your strongest AI/LLM project with concrete numbers]"
    - "[Achievement 2 — a shipped product or production system]"
    - "[Achievement 3 — anything showing end-to-end ownership]"
  dm_short_template: "{greeting}, I noticed {company} is hiring for {title}. I'm {bio_short}. Would love to connect."
  dm_long_template: |
    {greeting},

    Noticed {company} is hiring for {title}. The stack caught my eye — I've been building {stack} AI products.

    {achievements}

    Open to a 15-min chat to see if there's a fit?

    Thanks,
    {candidate_name}
  email_digest_subject_role: "AI"
  email_greeting: "Your Daily Job Digest"
